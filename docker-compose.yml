services:
  postgres:
    image: postgres:16-alpine
    container_name: tournament-auction-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tournament_auction
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tournament_auction"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
